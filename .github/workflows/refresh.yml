name: Refresh filter lists

# Recompiles the six GPL-3.0 community lists into the four Safari content-blocker
# sets + manifest.json daily, and commits any change. Runs on a PUBLIC repo, where
# GitHub Actions minutes (incl. macOS runners) are free and unlimited — the app repo
# stays private. The daily job is a no-op (skip-if-unchanged) on days upstream didn't
# change, so it commits only real updates and the app downloads only real changes.

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC daily
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write           # to commit the regenerated lists back to main

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    # macOS runner: SafariConverterLib builds reliably on macOS. It's still $0 on a
    # public repo. Package.swift needs swift-tools 6.0, which ships with Xcode 16+,
    # so this must be macos-15 or newer (macos-14 tops out at Swift 5.10).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (newest 16.x or later on the image)
        run: |
          XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC"
          swift --version

      - name: Refresh + repack lists
        run: bash refresh.sh

      # Ed25519-sign the exact manifest bytes. The app refuses any manifest whose
      # detached signature doesn't verify against the public key it ships with.
      # Runs every time (signing is deterministic, so an unchanged manifest
      # produces an unchanged .sig) and nothing may touch manifest.json after it.
      - name: Sign manifest
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
          EXPECTED_PUBLIC_KEY: FUuli/96lW5BN5EryrDVXwmcrs0+50hCj5sZHROlb4g=
        run: swift sign_manifest.swift manifest.json

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "centinal-lists bot"
            git config user.email "noreply@github.com"
            git add -A
            git commit -m "lists: daily refresh ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to publish."
          fi
